[project]
name = "fletbatteries"
version = "0.1.0"
description = "FletBatteries is a set of framework-like tools designed to simplify the development of applications with Flet."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Solvo", email = "info@solvosoft.com" },
]
dependencies = [
    "flet==1.0.4",
    "sqlalchemy>=2.0",
    "bcrypt>=4.2",
    "requests>=2.32",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
charts = ["flet-charts==1.0.4"]
maps = [
    "flet-map==1.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fletbatteries"]

[tool.hatch.build.targets.sdist]
include = ["src/fletbatteries", "README.md", "LICENSE"]

[dependency-groups]
# Lo que necesita la app de ejemplo (demo/) además del paquete
demo = [
    "fletbatteries[api,charts,maps]",
    "flet-rive==1.0.4",
    "python-dotenv>=1.0",
]
dev = [
    { include-group = "demo" },
    "flet[all]==1.0.4",
    "pytest>=8",
    "pytest-asyncio>=1.1",
    "httpx2>=2.13",
    "playwright>=1.48",
    "pillow>=10",
    "ruff>=0.6",
]

[tool.uv]
package = true

[tool.flet]
org = "com.solvosoft"
product = "FletBatteries"
company = "Solvo"
copyright = "Copyright (C) 2025 by Solvo"

[tool.flet.app]
path = "demo"
module = "main"

# `make build-linux`: app de escritorio compilada solo con las extensiones que
# usa la demo (Rive, charts, mapas). No incluye el reproductor de video
# (media_kit/libmpv), que hace caer al cliente "full" precompilado en Linux.
[tool.flet.linux]
dependencies = [
    "fletbatteries",
    "flet-charts==1.0.4",
    "flet-map==1.0.4",
    "flet-rive==1.0.4",
    "python-dotenv>=1.0",
]

[tool.flet.linux.dev_packages]
fletbatteries = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["demo", "src", "."]

[tool.ruff]
line-length = 120
extend-exclude = ["demo/assets"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811"]
